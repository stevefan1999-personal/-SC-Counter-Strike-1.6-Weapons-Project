name: Plugin

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/plugin.yml
      - Justfile
      - metamod/counterlife/**
      - docs/metamod.md
  pull_request:
  workflow_dispatch:

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: clippy, rustfmt

      - name: Linux i686 toolchain
        if: runner.os == 'Linux'
        run: |
          rustup target add i686-unknown-linux-gnu
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev gcc-multilib g++-multilib libc6-dev-i386 pkg-config curl

      - name: Windows i686 toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: rustup target add i686-pc-windows-msvc

      - uses: KyleMayes/install-llvm-action@v2
        if: runner.os == 'Windows'
        with:
          version: "18"

      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-nextest

      - name: Lint, unit tests, and the plugin
        shell: bash
        run: just metamod-lint && just metamod-test && just metamod-build

  e2e:
    name: dedicated server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24

      - name: Linux i686 toolchain
        if: runner.os == 'Linux'
        run: |
          rustup target add i686-unknown-linux-gnu
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev gcc-multilib g++-multilib libc6-dev-i386 lib32stdc++6 pkg-config curl

      - name: Windows i686 toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: rustup target add i686-pc-windows-msvc

      - uses: KyleMayes/install-llvm-action@v2
        if: runner.os == 'Windows'
        with:
          version: "18"

      - uses: taiki-e/install-action@just
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8

      - uses: actions/cache@v4
        id: server
        with:
          path: ${{ runner.temp }}/svencoop
          key: svencoop-276060-${{ runner.os }}-v1

      - name: Install the Sven Co-op dedicated server
        if: steps.server.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            root="$(cygpath -u "$RUNNER_TEMP")"
          else
            root="${RUNNER_TEMP}"
          fi
          install="$root/svencoop"
          mkdir -p "$install" "$root/steamcmd"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl -fsSL -o "$root/steamcmd.zip" https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip
            STEAM_ZIP="$(cygpath -w "$root/steamcmd.zip")"
            STEAM_DIR="$(cygpath -w "$root/steamcmd")"
            export STEAM_ZIP STEAM_DIR
            powershell.exe -NoProfile -Command 'Expand-Archive -LiteralPath $env:STEAM_ZIP -DestinationPath $env:STEAM_DIR -Force'
            steam="$root/steamcmd/steamcmd.exe"
          else
            curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C "$root/steamcmd"
            steam="$root/steamcmd/steamcmd.sh"
            chmod +x "$steam"
          fi
          installed=0
          for _attempt in 1 2; do
            if "$steam" +force_install_dir "$install" +login anonymous +app_update 276060 validate +quit; then
              installed=1
              break
            fi
          done
          test "$installed" = 1
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            compgen -G "$install"/svends*.exe >/dev/null
          else
            compgen -G "$install"/svends* >/dev/null
          fi

      - name: Server, Counter-Life plugin, and fake client
        shell: bash
        env:
          SVEN_SERVER_DIR: ${{ runner.temp }}/svencoop
        run: just metamod-e2e 27016 hl_c01_a1
