[package]
name = "counterlife"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# metamod loads the cdylib; the tests in tests/ link the rlib to call the
# same C entry points.
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
# Sven Co-op runs metamod-svencoop. Cargo clones this revision and the crate
# fetches the header trees it binds against.
metamod-p = { git = "https://github.com/stevefan1999-personal/metamod-p-rs", rev = "1776bbbbca8091974c1b88a8ab3e4847625ea07b", features = ["fallguys"] }
