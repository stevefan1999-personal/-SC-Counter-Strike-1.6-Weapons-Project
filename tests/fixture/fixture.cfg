// Counter-Life CS 1.6 kill-feed fixture.
// "just fixture-start" launches with +lservercfgfile fixture.cfg, so the listen server runs this file
// on every map start instead of the stock listenserver.cfg (which sets sv_cheats 0).

// Server: cheats for "give", no freeze time, no round end, so kills never restart the round or move spawns.
sv_cheats 1
sv_aim 0
pausable 0
sv_maxspeed 320
mp_timelimit 0
mp_freezetime 0
mp_roundtime 9
mp_buytime 9
mp_round_infinite 1
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_forcerespawn 0
// Bots added mid-round spawn at once instead of waiting for a round that never comes.
mp_roundrespawn_time -1
// ReGameDLL appends extra fields to DeathMsg by default; Valve's server sends only killer, victim, headshot, weapon.
mp_deathmsg_flags 0
// Flashlights on, so the HUD shows the flashlight as on a Sven server (mp_flashlight 1 in its map defaults). The CS
// default is 0, which hides it: the reference state cs16-ref-hud.png has no flashlight.
mp_flashlight 1
// Skip the MOTD and the team and class menus: the human joins CT with a random model.
motdfile fixture-no-motd.txt
humans_join_team CT
mp_auto_join_team 1

// Bots: added explicitly by the capture script, silent, and passive until the script lets them fight.
bot_quota 0
bot_quota_mode normal
bot_join_after_player 1
bot_auto_vacate 0
bot_chatter off
bot_zombie 1
bot_stop 0
bot_difficulty 0

// Client: the aim maths in killfeed.ts assumes 0.022 degrees per mouse count and the Hor+ 90 degree view.
sensitivity 1
m_yaw 0.022
m_pitch 0.022
m_filter 0
m_rawinput 1
default_fov 90
gl_widescreen_yfov 1
hud_deathnotice_time 6
fps_max 100
volume 0
